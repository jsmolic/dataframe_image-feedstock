schema_version: 1

context:
  name: dataframe_image
  version: "0.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 8d6739da53c66bd557f217237bab45943a452760b808bb7a3e635a939eed0bb5

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - dataframe_image=dataframe_image._command_line:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
  run:
    - aiohttp
    - beautifulsoup4
    - matplotlib-base >=3.1
    - nbconvert >=5
    - pandas >=0.24
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - dataframe_image
        - tests
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - dataframe_image --help

about:
  summary: Embed pandas DataFrames as images in pdf and markdown files when converting from Jupyter Notebooks
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/dexplo/dataframe_image

extra:
  recipe-maintainers:
    - tdpetrou
